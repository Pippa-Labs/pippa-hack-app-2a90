# What to Wear: checks the live weather for a place and suggests an outfit,
# choosing from the person's own clothes when they list them.
#
# Weather comes from Open-Meteo (geocoding + forecast), which needs no key.
# The only thing sent to it is the place name and its coordinates.

manifest_version: 1

# Every hackathon app keeps nothing between calls. Do not change this.
persistence: none

# Public author name (a pseudonym). Shown as "by <name>" next to the app.
app_author_name: "Layer Up"

app:
  # Fixed by the repository name: Pippa-Labs/pippa-hack-app-2a90.
  id: hack.app_2a90
  name: What to Wear
  version: 0.1.0
  summary: >-
    Checks the live weather for your place and tells you what to wear,
    choosing from your own clothes if you list them.

agent_types:
  - personal

outcomes:
  - id: outfit.suggest
    summary: Suggest an outfit for the live weather in a place, optionally from clothes the person owns
    example_phrases:
      - what should I wear
      - do I need a coat
      - do I need an umbrella
      - should I bring a jacket
      - what should I wear from my wardrobe
      - is it shorts weather
      - which of my clothes should I wear
      - is it cold enough for a jumper
    inputs:
      - name: place
        type: string
        required: false
        description: >-
          The town or city the person names, exactly as written, for example
          "Leeds" or "New York". If the message does not name a place, return
          an empty string rather than guessing.
      - name: wardrobe
        type: array
        item_type: string
        required: false
        description: >-
          The clothes the person says they own or could wear, one item per
          entry, in their own words (for example "puffer", "raincoat",
          "jeans"). Leave this out entirely if they do not list any clothes.
          Never invent or add items they did not mention.
    output:
      - name: place_used
        type: string
        description: The place the weather was checked for, with its country.
      - name: feels_like_c
        type: integer
        description: What the temperature feels like now, in degrees Celsius.
      - name: rain_chance_percent
        type: integer
        description: The highest hourly chance of rain in the next 12 hours.
      - name: wind_kmh
        type: integer
        description: The current wind speed in km/h.
      - name: outfit
        type: array
        item_type: string
        description: What to wear, most important first.
      - name: from_your_wardrobe
        type: array
        item_type: string
        description: >-
          The clothes the person listed that suit the weather. Empty if they
          listed none, or none suit it.
